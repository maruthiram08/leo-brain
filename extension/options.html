<!DOCTYPE html>
<html>
<head>
    <title>Leo Extension Settings</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 24px;
            background-color: #0f172a;
            color: #f1f5f9;
            width: 400px;
        }
        h2 { border-bottom: 1px solid #334155; padding-bottom: 10px; margin-top: 0; }
        .group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px; }
        input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            box-sizing: border-box;
        }
        input:focus { outline: 2px solid #3b82f6; border-color: transparent; }
        button {
            background-color: #fbbf24;
            color: #0f172a;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        #status {
            margin-top: 10px;
            color: #4ade80;
            font-size: 13px;
            display: none;
        }
        .help { font-size: 12px; color: #94a3b8; margin-top: 6px; line-height: 1.4; }
        a { color: #60a5fa; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h2>Leo Settings</h2>
    
    <div class="group">
        <label for="token">Authentication Token</label>
        <input type="password" id="token" placeholder="Paste your token here">
        <div class="help">
            Go to <a href="http://localhost:3000/authorize" target="_blank">localhost:3000/authorize</a> to generate your token.
        </div>
    </div>

    <button id="save">Save Settings</button>
    <div id="status">Settings saved.</div>

    <script src="options.js"></script>
</body>
</html>
